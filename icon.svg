<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#232a3d"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.5" stop-color="#f4713b"/>
      <stop offset="1" stop-color="#c9315f"/>
    </linearGradient>
    <clipPath id="posterClip">
      <rect x="140" y="78" width="232" height="348" rx="20"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- The poster itself: 2:3, the real one-sheet ratio -->
  <g>
    <rect x="140" y="78" width="232" height="348" rx="20" fill="url(#poster)"/>

    <g clip-path="url(#posterClip)">
      <!-- sun/moon high in the frame -->
      <circle cx="316" cy="152" r="30" fill="#fff6d5" opacity="0.9"/>
      <!-- layered ridgeline, back to front -->
      <path d="M140 322 L206 250 L258 300 L318 232 L372 292 L372 426 L140 426 Z"
            fill="#5c1c46" opacity="0.55"/>
      <path d="M140 360 L196 306 L250 350 L306 296 L372 356 L372 426 L140 426 Z"
            fill="#3a1030" opacity="0.75"/>
      <!-- title / tagline bars, echoing the display layout -->
      <rect x="168" y="376" width="140" height="16" rx="8" fill="#ffffff" opacity="0.92"/>
      <rect x="168" y="402" width="86"  height="11" rx="5.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- "Live" indicator -->
  <circle cx="372" cy="98" r="41" fill="#0b0e16"/>
  <circle cx="372" cy="98" r="25" fill="#ff3b4e"/>
  <circle cx="372" cy="98" r="25" fill="none" stroke="#ff3b4e" stroke-width="9" opacity="0.35">
    <animate attributeName="r" values="25;36;25" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0;0.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
